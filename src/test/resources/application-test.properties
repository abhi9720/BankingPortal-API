# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE,USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.main.allow-circular-references=true
server.error.include-message=always

# JWT - must be at least 256 bits (32 chars) for HMAC-SHA256
jwt.secret=QmFua2luZ1BvcnRhbFRlc3RTZWNyZXRLZXlGb3JVbml0VGVzdHNXaXRoQXRMZWFzdDY0Qnl0ZXNPZkxlbmd0aCEh
jwt.expiration=86400000
jwt.header=Authorization
jwt.prefix=Bearer

# Spring Mail - overridden by TestConfig with GreenMail
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Redis - used lazily; not required to be running for most tests
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Geolocation API - will fail gracefully in tests
geo.api.url=http://localhost/geo/
geo.api.key=test-key

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.webapp.bankingportal=WARN
